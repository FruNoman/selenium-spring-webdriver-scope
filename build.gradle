plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.frunoyman'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.seleniumhq.selenium:selenium-java:4.25.0'
    implementation 'io.github.bonigarcia:webdrivermanager:5.9.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.testng:testng:7.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useTestNG() {
        suites 'src/test/resources/testng.xml'
    }
    // `--tests SomeClass` would otherwise be ignored: an explicit suite XML
    // always runs whole. With a --tests filter, drop the suite and let
    // Gradle's own class/method filter pick what runs.
    doFirst {
        if (!filter.commandLineIncludePatterns.isEmpty()) {
            options.suiteXmlFiles.clear()
        }
    }
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
    // lets -Dspring.profiles.active=firefox,grid on the gradlew command
    // line reach the test JVM, so switching local/grid or chrome/firefox
    // never needs a code or properties-file change.
    systemProperties.putAll(
            System.properties.findAll { k, v -> ['spring.', 'grid.', 'test.'].any { k.toString().startsWith(it) } }
    )
}

// Separate task, separate TestNG suite (parallel="methods" thread-count=10)
// — kept apart from the default `test` task so the plain sequential demo
// above isn't accidentally parallelized too.
tasks.register('testParallel', Test) {
    group = 'verification'
    description = 'Runs ParallelGridTests with TestNG parallel="methods" thread-count=10 against Selenium Grid.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useTestNG() {
        suites 'src/test/resources/testng-parallel.xml'
    }
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
    systemProperties.putAll(
            System.properties.findAll { k, v -> ['spring.', 'grid.', 'test.'].any { k.toString().startsWith(it) } }
    )
}
