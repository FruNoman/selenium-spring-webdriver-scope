# Two independent axes, both Spring profiles:
#   browser — chrome | firefox
#   runner  — local | grid (application-<runner>.yml)
# Override per run with -Dspring.profiles.active=firefox,grid, or any value
# with an env var / -D (GRID_URL → grid.url, BASE_URL → base.url).
spring:
  profiles:
    active: chrome,local

base:
  url: https://www.selenium.dev/selenium/web/

implicit:
  timeout:
    seconds: 10
